<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #d3dae8;
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
    }

    .cake {
      margin: 100px auto;
      position: relative;
      width: 300px;
      height: 250px;
    }

    .layer {
      background: #a3d2a7;
      border: 3px solid white;
      border-radius: 50%/10%;
      height: 60px;
      width: 100%;
      position: absolute;
      left: 0;
    }

    .layer:nth-child(1) {
      bottom: 0;
    }

    .layer:nth-child(2) {
      bottom: 70px;
      width: 240px;
      left: 30px;
      background: #f7e8aa;
    }

    .layer:nth-child(3) {
      bottom: 130px;
      width: 180px;
      left: 60px;
      background: #ffa500;
    }

    .candle {
      position: absolute;
      width: 10px;
      height: 50px;
      background: teal;
      left: 145px;
      bottom: 190px;
    }

    .flame {
      width: 0;
      height: 0;
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 20px solid orange;
      position: absolute;
      top: -20px;
      left: -2px;
    }

    h1 {
      margin-top: 30px;
      font-size: 3em;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="cake">
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="layer"></div>
    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>
  <h1>Happy Birthday Furina!</h1>
</body>
</html>
