
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ucapan Selamat Ulang Tahun</title>
  <style>
    body {
      background: linear-gradient(to right, #ffecd2, #fcb69f);
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      padding: 50px;
      color: #333;
    }

    h1 {
      font-size: 3em;
      color: #ff6f61;
      animation: bounce 1s infinite alternate;
    }

    p {
      font-size: 1.5em;
      margin-top: 20px;
    }

    .cake {
      font-size: 4em;
      margin-top: 30px;
    }

    @keyframes bounce {
      0%   { transform: translateY(0); }
      100% { transform: translateY(-20px); }
    }
  </style>
</head>
<body>
  <h1>Selamat Ulang Tahun!</h1>
  <p>Semoga harimu penuh kebahagiaan dan kejutan menyenangkan.</p>
  <div class="cake">🎂</div>
</body>
</html>
